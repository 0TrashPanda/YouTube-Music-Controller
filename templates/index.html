<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static',filename='images/icons/speaker2.png') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/output.css') }}">
    <title>YTMC</title>
</head>
<body>
    <button class="text-sm" hx-post="/play" hx-swap="none">play</button>
    <button class="text-sm" hx-get="/get_time" hx-target="p">time</button>
    <button class="text-sm" hx-post="/play_pause" hx-swap="none">play/pause</button>
    <p id="time">00:00 - 00:00</p>
    <div class="w-full max-w-96 m-3 bg-secondary rounded-lg flex justify-between cursor-pointer">
        <img hx-post="/searchr" hx-target="#song-container" hx-include="[name='search_query']" class="w-16 h-10 px-4 py-2" src="{{ url_for('static',filename='images/icons/loupe.png') }}" alt="search">
        <input id="search_input" hx-post="/searchr" hx-target="#song-container" hx-indicator="#loading-songs" class="w-full p-2 bg-tranparent focus:outline-none" name="search_query" type="text">
        <img class="w-16 h-10 px-4 py-2" src="{{ url_for('static',filename='images/icons/clear.png') }}" alt="clear" onclick="clearThisID('search_input')">
    </div>
    <div id="song-container" class="sm:px-4 w-1/2 sm:w-3/5">
    </div>
</body>
<script type="text/javascript">
    function clearThisID(target) {
        document.getElementById(target).value = "";
    }

    var socket = io.connect('http://' + document.domain + ':' + location.port);

    socket.on('connect', function() {
        console.log('Connected to WebSocket server');
    });

    socket.on('disconnect', function() {
        console.log('Disconnected from WebSocket server');
    });

    socket.on('innerHTML', function(data) {
        var songContainer = document.querySelector(data.div); // Get the song container element
        songContainer.innerHTML = data.html;
        htmx.process(songContainer);
    });

    socket.on('outerHTML', function(data) {
        var songContainer = document.querySelector(data.div); // Get the song container element
        songContainer.outerHTML = data.html;
        var songContainer = document.querySelector(data.div); // Get the song container element
        htmx.process(songContainer);
    });
</script>
</html>
