<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static',filename='images/icons/speaker2.png') }}">
    <link rel="stylesheet" href="{{ url_for('static',filename='css/output.css') }}">
    <title>YTMC</title>
</head>
<body>
    <div class="overflow-x-auto scrollbar-hide lg:overflow-visible flex flex-row xl:space-x-4 space-x-0 2xl:container xl:mx-auto snap-x snap-mandatory">

        <div id="search" class="p-1 flex-none w-screen lg:w-auto lg:flex-1 h-screen overflow-y-auto snap-center snap-always">
            <div class="w-full max-w-96 m-3 bg-secondary rounded-lg flex flex-col cursor-pointer relative">
                <div class="flex justify-between">
                    <img id="search_img" hx-post="/searchr" hx-target="#song-container" hx-include="[name='search_query']" class="w-16 h-10 px-4 py-2" src="{{ url_for('static',filename='images/icons/loupe.png') }}" alt="search" onclick="hideSuggestions()">
                    <input id="search_input" hx-post="/searchr" hx-target="#song-container" hx-trigger="keyup[key=='Enter']" class="w-full p-2 bg-transparent focus:outline-none" name="search_query" type="text" oninput="showSuggestions(this.value)" onfocusout="hideSuggestions()" placeholder="Search for songs" onfocus="showSuggestions(this.value)">
                    <img class="w-16 h-10 px-4 py-2" src="{{ url_for('static',filename='images/icons/clear.png') }}" alt="clear" onclick="clearThisID('search_input')">
                </div>
                <div id="suggestions-container" class="bg-primary w-full absolute top-full left-0 z-10 border border-gray-300 rounded-lg hidden">
                    <!-- Suggestions will be dynamically inserted here -->
                </div>
            </div>
            <div id="song-container" class="">
            </div>
        </div>

        <div id="player" class="p-1 flex-none w-screen lg:w-auto lg:flex-1 h-screen overflow-y-auto snap-center snap-always text-center">
            <!-- Song Thumbnail -->
            <img id="song_thumbnail" class="max-h-[50vh] mb-6 mx-auto rounded-lg shadow-lg object-cover" src="https://via.placeholder.com/300" alt="Song Thumbnail">

            <!-- Song Details -->
            <div class="mb-6">
                <h2 id="current_song_title" class="text-xl font-bold">Song Title</h2>
                <p id="current_song_artist" class="text-sm text-gray-400">Artist 1, Artist 2</p>
                <p id="current_song_album" class="text-sm text-gray-400">Album Name</p>
                <p id="current_song_year" class="text-sm text-gray-400">2024</p>
            </div>

            <!-- Controls -->
            <div class="flex justify-between items-center mb-6">
                <button id="prev" hx-post="/back" hx-swap="none" class="w-10 h-10">
                    <img src="https://img.icons8.com/ios-filled/50/ffffff/skip-to-start.png" alt="Previous">
                </button>
                <button id="playPause" hx-post="/play_pause" hx-swap="none" class="w-14 h-14">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class=""><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" /></svg>
                </button>
                <button id="next" hx-post="/skip" hx-swap="none" class="w-10 h-10">
                    <img src="https://img.icons8.com/ios-filled/50/ffffff/end.png" alt="Next">
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="bg-gray-700 h-2 rounded-full relative">
                <div id="progressBar" class="bg-green-500 h-full rounded-full" style="width: 50%;"></div>
            </div>
            <input type="range" min="1" max="100" value="50" class="slider m-6 bg-gray-700" id="volume" oninput="setVolume(this.value)">
        </div>

        <div id="queue" class="p-1 flex-none w-screen lg:w-auto lg:flex-1 h-screen overflow-y-auto snap-center snap-always">
        </div>

    </div>

    <!-- Bottom navigation bar for small screens -->
    <div class="lg:hidden fixed bottom-0 w-full bg-[rgba(15,15,15,.97)] text-white flex justify-around py-2">
        <button onclick="scrollToPanel('search')" class="focus:outline-none"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6"><path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" /></svg></button>
        <button onclick="scrollToPanel('player')" class="focus:outline-none"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15.91 11.672a.375.375 0 0 1 0 .656l-5.603 3.113a.375.375 0 0 1-.557-.328V8.887c0-.286.307-.466.557-.327l5.603 3.112Z" /></svg></button>
        <button onclick="scrollToPanel('queue')" class="focus:outline-none"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0ZM3.75 12h.007v.008H3.75V12Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm-.375 5.25h.007v.008H3.75v-.008Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" /></svg></button>
    </div>

</body>
<script type="text/javascript">
    var updateInteval;
    var length = 0
    let startTime;
    let elapsedTime = 0;
    let progress_bar = document.querySelector('#progressBar');
    let progress_bar_container = progress_bar.parentElement;
    let isDragging = false;
    let current_song_uuid = null;

    function scrollToPanel(panelId) {
        const panel = document.getElementById(panelId);
        panel.scrollIntoView({ behavior: 'smooth', block: 'start', inline: 'center' });
    }

    function clearThisID(target) {
        document.getElementById(target).value = "";
    }

    var socket = io.connect('http://' + document.domain + ':' + location.port);

    socket.on('connect', function() {
        console.log('Connected to WebSocket server');
    });

    socket.on('disconnect', function() {
        console.log('Disconnected from WebSocket server');
    });

    socket.on('update_queue', function(data) {
        var queue = document.querySelector('#queue'); // Get the song container element
        queue.innerHTML = "";
        for (song of data) {
            queue.innerHTML += createQueueItem(song);
        }
        scrollToCurrentSong(current_song_uuid);
        HighlightCurrentSong(current_song_uuid);
        htmx.process(queue);
    });

    socket.on('play_state', function(data) {
        var play_button = document.querySelector('#playPause'); // Get the song container element
        if (data == 'Playing') {
            startTime = Date.now() - elapsedTime;
            if (updateInteval) clearInterval(updateInteval);
            updateInteval = setInterval(function () {
                elapsedTime = Date.now() - startTime;
                updateProgressBar();
            }, 50);
            play_button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class=""><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" /></svg>'
        } else if (data = 'Paused') {
            clearInterval(updateInteval);
            play_button.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class=""><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" /></svg>'
        }
    });

    socket.on('current_song', function(data) {
        var song_thumbnail = document.querySelector('#song_thumbnail');
        song_thumbnail.src = data.thumbnail;
        var current_song_title = document.querySelector('#current_song_title');
        current_song_title.innerHTML = data.title;
        var current_song_artist = document.querySelector('#current_song_artist');
        current_song_artist.innerHTML = data.artists;
        var current_song_album = document.querySelector('#current_song_album');
        current_song_album.innerHTML = data.album;
        var current_song_year = document.querySelector('#current_song_year');
        current_song_year.innerHTML = data.release_year;
        length = data.duration - 1;
        updateProgressBar();
        scrollToCurrentSong(data.uuid);
        HighlightCurrentSong(data.uuid);
        current_song_uuid = data.uuid;
    });

    function HighlightCurrentSong(uuid) {
        var queue = document.querySelector('#queue');
        var queue_items = queue.children;
        for (item of queue_items) {
            if (item.querySelector('#uuid').value == uuid) {
                item.style.backgroundColor = 'rgba(255,255,255,.1)';
            } else {
                item.style.backgroundColor = 'transparent';
            }
        }
    }

    function scrollToCurrentSong(uuid) {
        var queue = document.querySelector('#queue');
        var queue_items = queue.children;
        for (item of queue_items) {
            if (item.querySelector('#uuid').value == uuid) {
                item.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
                return;
            }
        }
    }

    socket.on('volume', function(data) {
        var volume = document.querySelector('#volume');
        volume.value = data;
    });

    socket.on('current_time', function(data) {
        startTime = Date.now() - data;
        elapsedTime = data;
        updateProgressBar();
    });

    function createQueueItem(song) {
        return `
        <div id="queue_item" class="p-2 border-b-[1px] h-20 flex items-center border-[rgba(255,255,255,.1)]" draggable="true">
            <img hx-post="/jump_queue" hx-include="next input" hx-swap="none" class="mr-4 ml-2 sm:ml-0 h-12 w-12 min-w-12 md:min-w-[60px] md:h-[60px]" src="${song.thumbnail}" alt="${song.title}">
            <div hx-post="/jump_queue" hx-include="next input" hx-swap="none" class="flex flex-wrap flex-col">
                <p class="mb-1 text-ellipsis whitespace-nowrap overflow-hidden w-full">${song.title}</p>
                <div class="flex text-[#b4b4b4]">
                    <p class="text-xs text-dark">${song.artists}</p>
                    <span class="text-xs text-dark whitespace-pre"> • </span>
                    <p class="text-xs text-dark">${song.duration_string}</p>
                </div>
            </div>
            <div class="ml-auto">
                <img hx-post="/remove" hx-include="next input" hx-swap="none" class="cursor-pointer w-6 min-w-6 m-2 clear-icon" src="{{ url_for('static',filename='images/icons/clear.png') }}" alt="remove">
            </div>
            <input id="uuid" type="hidden" name="uuid" value="${song.uuid}">
        </div>`;
    }

    var queueList = document.getElementById('queue');
    new Sortable(queueList, {
        animation: 150,
        handle: '.clear-icon',
        onEnd: function (evt) {
            uuidList = Array.from(queueList.children).map(child => child.querySelector('#uuid').value);
            socket.emit('reorder', uuidList);
        }
    });

    function updateProgressBar() {
        if (isDragging) return;
        procent = Math.min(elapsedTime / (length * 10), 100);
        progress_bar.style.width = procent + '%';
    }

    function setVolume(val) {
        socket.emit('volume', val);
    }

    function showSuggestions(value) {
        if (value.length == 0) {
            document.getElementById('suggestions-container').classList.add('hidden');
            return;
        }
        fetch('/search_suggestions?q=' + encodeURIComponent(value))
            .then(response => response.json())
            .then(data => {
                var suggestionsContainer = document.getElementById('suggestions-container');
                suggestionsContainer.innerHTML = '';
                data.forEach(suggestion => {
                    if (value == suggestion.text) {
                        return;
                    }
                    // Create a div for each suggestion
                    const suggestionDiv = document.createElement('div');
                    suggestionDiv.className = 'p-2 cursor-pointer hover:bg-zinc-700';
                    // Create a span to hold the formatted suggestion text
                    const suggestionText = document.createElement('span');
                    // Process the "runs" to format text
                    suggestion.runs.forEach(run => {
                        const textNode = document.createElement('span');
                        textNode.textContent = run.text;
                        if (run.bold) {
                            textNode.style.fontWeight = 'bold';
                        }
                        suggestionText.appendChild(textNode);
                    });
                    // Append the formatted text to the suggestion div
                    suggestionDiv.appendChild(suggestionText);
                    // Add click event to select suggestion
                    suggestionDiv.onmousedown = () => {
                        let search_input = document.getElementById('search_input');
                        text = suggestionText.textContent;
                        search_input.value = text;
                        document.getElementById('search_img').click();
                    };
                    // Append suggestion div to the container
                    suggestionsContainer.appendChild(suggestionDiv);
                });
                // Show the suggestions container if there are suggestions
                if (data.length > 0) {
                    suggestionsContainer.classList.remove('hidden');
                } else {
                    suggestionsContainer.classList.add('hidden');
                }
            });
    }

    function hideSuggestions() {
        setTimeout(() => {
            document.getElementById('suggestions-container').classList.add('hidden');
        }, 100);
    }

    function updatePosition(event) {
        if (!isDragging) return;
        const containerRect = progress_bar_container.getBoundingClientRect();
        let horizontalPosition = ((event.clientX - containerRect.left) / containerRect.width) * 100;
        horizontalPosition = Math.max(0, Math.min(100, horizontalPosition));
        progress_bar.style.width = `${horizontalPosition}%`;
        socket.emit('seek', horizontalPosition / 100);
    }

    function startDragging(event) {
        isDragging = true;
        updatePosition(event);
    }

    function stopDragging() {
        isDragging = false;
    }

    progress_bar_container.addEventListener('mousedown', startDragging);
    document.addEventListener('mousemove', updatePosition);
    document.addEventListener('mouseup', stopDragging);
    progress_bar.addEventListener('dragstart', function (event) {
        event.preventDefault();
    });
    progress_bar_container.addEventListener('mousedown', function (event) {
        event.preventDefault();
    });

    scrollToPanel('player');

    document.getElementById("search_input").addEventListener("keypress", function(event) {
        // If the user presses the "Enter" key on the keyboard
        if (event.key === "Enter") {
          hideSuggestions();
        }
      });
</script>
</html>
